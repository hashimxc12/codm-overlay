name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Fix Structure
      run: |
        if [ -f Codm-esp-main.zip ]; then
          unzip -o Codm-esp-main.zip
          # إذا تم فك الضغط داخل مجلد فرعي، سنقوم بنقل محتوياته مباشرة إلى الجذر
          shopt -s dotglob
          if [ -d "Codm-esp-main" ]; then
            cp -r Codm-esp-main/* .
            rm -rf Codm-esp-main
          fi
          # في حال كان اسم المجلد الداخلي مختلفاً (مثل codm-esp أو ما شابه)
          for dir in */; do
            if [ "$dir" != ".github/" ]; then
              if [ -f "${dir}settings.gradle" ] || [ -d "${dir}app" ]; then
                cp -r "${dir}"* .
                rm -rf "$dir"
                break
              fi
            fi
          done
        fi
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
