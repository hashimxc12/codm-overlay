name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Fix Structure
      run: |
        if [ -f Codm-esp-main.zip ]; then
          unzip -o Codm-esp-main.zip
        fi
        # إذا وجد مجلد فرعي ناتج عن فك الضغط، ننقل محتوياته فوراً إلى الجذر
        if [ -d "Codm-esp-main" ]; then
          cp -r Codm-esp-main/* .
        fi
        # عرض محتويات المجلد للتأكد من وجود مجلد app في المكان الصحيح
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
