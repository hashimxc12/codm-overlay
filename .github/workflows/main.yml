name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Fix Path
      run: |
        if [ -f Codm-esp-main.zip ]; then
          unzip -q Codm-esp-main.zip
          # البحث التلقائي عن المجلد الناتج ونقل محتوياته للجذر الرئيسي
          find . -maxdepth 2 -type d -name "Codm-esp-main*" | while read dir; do
            if [ "$dir" != "." ]; then
              cp -r "$dir"/* .
            fi
          done
        fi
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
